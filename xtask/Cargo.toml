[package]
name = "xtask"
version.workspace = true
edition.workspace = true
license.workspace = true
publish = false

[lints]
workspace = true

[dependencies]
# The checksums of the published files. Already in the lock file (the desktop backend uses it).
sha2 = "0.11"
# Merging the catalog entry as JSON, not as text. Already in the lock file too.
serde_json = { workspace = true }
# The one place that knows where the catalog and the bucket live.
bd-launcher-core = { workspace = true }
