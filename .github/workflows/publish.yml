# Publish an app to the BD catalog.
#
# Copy this file into the repository of the app you publish and adjust the three places marked
# TODO. It runs when you cut a release: it builds the files, uploads them to the Firebase
# storage bucket and writes the app's entry in the catalog.
#
# The publishing tool lives in the launcher's repository, so the workflow checks it out beside
# the app and runs it from there.
#
# Two secrets are needed in the repository's settings (Settings → Secrets and variables →
# Actions):
#   FIREBASE_TOKEN             the token from `firebase login:ci`
#   FIREBASE_SERVICE_ACCOUNT   the service account's JSON (Project settings → Service accounts)

name: publish

on:
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      version:
        description: "The version to publish, without a leading v (1.2.0)"
        required: true

permissions:
  contents: read
  id-token: write

env:
  APP_ID: meuapp # TODO: the app's machine name
  FIREBASE_PROJECT: bd-tecnologia
  LAUNCHER_REPO: bd-tecnologia/bd-launcher

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          path: app

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: ${{ env.LAUNCHER_REPO }}
          path: launcher

      - uses: dtolnay/rust-toolchain@b725eda525362e7cf34af9a7243cac1e3f01a7ec # stable
        with:
          toolchain: stable

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22

      - name: Install the Firebase CLI
        run: npm i -g firebase-tools

      - name: Log in to Firebase
        run: firebase login:ci --no-localhost
        env:
          FIREBASE_TOKEN: ${{ secrets.FIREBASE_TOKEN }}

      - name: Get a database token
        id: auth
        uses: google-github-actions/auth@7c6bc770dae815cd3e89ee6cdf493a5fab2cc093 # v3.0.0
        with:
          credentials_json: ${{ secrets.FIREBASE_SERVICE_ACCOUNT }}

      # TODO: build the files, and put them in a folder named after the version.
      - name: Build
        working-directory: app
        run: echo "Build the app here; the files go to dist/" >> "$GITHUB_STEP_SUMMARY"

      - name: Publish
        working-directory: app
        env:
          INPUT_VERSION: ${{ inputs.version }}
        run: |
          VERSION="${GITHUB_REF_NAME#v}"
          if [ "$INPUT_VERSION" != "" ]; then VERSION="$INPUT_VERSION"; fi
          cargo run --quiet --manifest-path launcher/Cargo.toml -p xtask -- publish \
            --app "$APP_ID" \
            --version "$VERSION" \
            --dir "dist/$VERSION" \
            --icon "assets/icon.png" \
            --project "$FIREBASE_PROJECT" \
            --notes "$(git tag -l --format='%(contents)' "v$VERSION" 2>/dev/null || true)"
        env:
          BD_LAUNCHER_FIREBASE_TOKEN: ${{ steps.auth.outputs.access_token }}
