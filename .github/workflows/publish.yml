# Publish an app to the BD catalog.
#
# Copy this file into the repository of the app you publish and adjust the two places marked
# TODO. It runs when you cut a release: it attaches the built files to the GitHub release and
# writes the app's entry in the catalog. No Storage bucket is involved: the files are served by
# GitHub Releases, which is free for public repositories.
#
# The publishing tool lives in the launcher's repository, so the workflow checks it out beside
# the app and runs it from there.
#
# One secret is needed in the app's repository (Settings → Secrets and variables → Actions):
#   FIREBASE_SERVICE_ACCOUNT   the service account's JSON (Project settings → Service accounts)

name: publish

on:
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      version:
        description: "The version to publish, without a leading v (1.2.0)"
        required: true

permissions:
  contents: write
  id-token: write

env:
  APP_ID: meuapp # TODO: the app's machine name

jobs:
  publish:
    # The launcher's own releases are published with `--launcher`; this template is for the
    # apps. Skipping it here keeps a launcher release from trying to publish an app called
    # "meuapp". A copy in an app's repository runs normally.
    if: github.repository != 'daviloureiro/bd-launcher'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          path: app

      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          repository: daviloureiro/bd-launcher
          path: launcher

      - uses: dtolnay/rust-toolchain@b725eda525362e7cf34af9a7243cac1e3f01a7ec # stable
        with:
          toolchain: stable

      - name: Get a database token
        id: auth
        uses: google-github-actions/auth@c200f3691d83b41bf9bbd8638997a462592937ed # v2
        with:
          credentials_json: ${{ secrets.FIREBASE_SERVICE_ACCOUNT }}
          token_format: access_token

      # TODO: build the files, and put them in a folder named after the version.
      - name: Build
        working-directory: app
        run: echo "Build the app here; the files go to dist/." >> "$GITHUB_STEP_SUMMARY"

      - name: Version
        id: version
        env:
          INPUT_VERSION: ${{ inputs.version }}
        run: |
          VERSION="${GITHUB_REF_NAME#v}"
          if [ "$INPUT_VERSION" != "" ]; then VERSION="$INPUT_VERSION"; fi
          echo "value=$VERSION" >> "$GITHUB_OUTPUT"

      - name: Attach the files to the release
        working-directory: app
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ steps.version.outputs.value }}
        run: |
          if gh release view "v$VERSION" > /dev/null 2>&1; then
            gh release upload "v$VERSION" "dist/$VERSION"/* --clobber
          else
            gh release create "v$VERSION" "dist/$VERSION"/* --title "v$VERSION" --generate-notes
          fi

      - name: Publish
        working-directory: app
        env:
          BD_LAUNCHER_FIREBASE_TOKEN: ${{ steps.auth.outputs.access_token }}
          VERSION: ${{ steps.version.outputs.value }}
        run: |
          cargo run --quiet --manifest-path launcher/Cargo.toml -p xtask -- publish \
            --app "$APP_ID" \
            --version "$VERSION" \
            --dir "dist/$VERSION" \
            --no-upload \
            --base-url "https://github.com/${{ github.repository }}/releases/download/v$VERSION/" \
            --icon "https://raw.githubusercontent.com/${{ github.repository }}/${{ github.sha }}/assets/icon.png" \
            --notes "$(git tag -l --format='%(contents)' "v$VERSION" 2>/dev/null || true)"
