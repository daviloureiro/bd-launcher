# Quick static checks for the release pipeline (seconds, no Rust build): workflow syntax,
# packaging shell/PowerShell scripts, and the Linux desktop/AppStream/Flatpak metadata.
name: Packaging lint

on:
  push:
    branches: [main, release]
    paths: [".github/workflows/**", "packaging/**", "assets/app-icon/**"]
  pull_request:
    paths: [".github/workflows/**", "packaging/**", "assets/app-icon/**"]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: packaging-lint-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint:
    # The shared workflows live in the upstream organisation. Point them at your own copy when
# you have one; they are pinned, so update them deliberately.
    uses: storytold/craft-common-actions/.github/workflows/packaging-lint.yml@2446e3bd4f08cb303a6b590be5ff5a0def2bf534 # main
